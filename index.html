<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Pix — Painel de Controle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: white; }
    .hidden { display: none !important; }
    
    /* Tela de Login */
    #telaLogin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    .login-box h1 { margin-bottom: 30px; color: #00d4ff; }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0 20px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: rgba(255,255,255,0.1);
      color: white;
    }
    button {
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { transform: scale(1.03); }
    .btn-primary { background: #00d4ff; color: #000; width: 100%; }
    .btn-sair { background: #e74c3c; color: white; }
    #msgErro { color: #ff6b6b; margin-top: 10px; display: none; }
    
    /* Tela Principal */
    header {
      background: rgba(0,0,0,0.3);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 22px; color: #00d4ff; }
    .container { padding: 20px; max-width: 500px; margin: 0 auto; }
    
    /* Box da Jukebox */
    .box-card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .status-line { display: flex; justify-content: space-between; margin: 8px 0; }
    .online { color: #4cd137; }
    .offline { color: #e74c3c; }
    
    /* Botões de Valor */
    .botoes-valores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }
    .btn-valor { background: #00d4ff; color: #000; font-size: 18px; padding: 18px; }
    .btn-valor:active { transform: scale(0.97); }
    
    /* Histórico */
    .historico { margin-top: 24px; }
    .historico h3 { margin-bottom: 12px; color: #aaa; }
    .item-hist {
      background: rgba(255,255,255,0.03);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .total-box {
      background: rgba(0,212,255,0.1);
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #00d4ff;
    }
    .btn-zerar { background: #f39c12; color: white; margin-top: 12px; width: 100%; }
  </style>
</head>
<body>

<!-- Tela de Login -->
<div id="telaLogin">
  <div class="login-box">
    <h1>🎵 Jukebox Pix</h1>
    <label>Digite a senha de acesso:</label>
    <input type="password" id="senha" placeholder="Senha...">
    <button class="btn-primary" onclick="entrar()">Entrar</button>
    <div id="msgErro">Senha incorreta!</div>
  </div>
</div>

<!-- Tela Principal do App -->
<div id="telaApp" class="hidden">
  <header>
    <h1>🎵 Jukebox Pix</h1>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </header>
  
  <div class="container">
    <!-- Informações da Máquina -->
    <div class="box-card">
      <h3 id="nomeMaquina">Carregando...</h3>
      <div class="status-line">
        <span>Status:</span>
        <span id="statusOnline" class="offline">● Offline</span>
      </div>
      <div class="status-line">
        <span>IP:</span>
        <span id="ipMaquina">---</span>
      </div>
      <div class="status-line">
        <span>Total do Período:</span>
        <span id="valorTotal">R$ 0,00</span>
      </div>
    </div>
    
    <!-- Botões de Envio -->
    <div class="botoes-valores">
      <button class="btn-valor" onclick="enviarPulso(2, 2.00)">R$ 2,00</button>
      <button class="btn-valor" onclick="enviarPulso(5, 5.00)">R$ 5,00</button>
      <button class="btn-valor" onclick="enviarPulso(10, 10.00)">R$ 10,00</button>
      <button class="btn-valor" onclick="enviarPulso(20, 20.00)">R$ 20,00</button>
      <button class="btn-valor" onclick="enviarPulso(50, 50.00)">R$ 50,00</button>
      <button class="btn-valor" onclick="enviarPulso(0, 0)" style="background:#888; color:white;">Teste</button>
    </div>
    
    <!-- Histórico -->
    <div class="historico">
      <h3>📊 Histórico</h3>
      <div id="listaHistorico"></div>
      
      <div class="total-box">
        Total: <span id="exibeTotal">R$ 0,00</span>
      </div>
      
      <button class="btn-zerar" onclick="zerarPeriodo()">🔄 Zerar Período</button>
    </div>
  </div>
</div>

<script>
// ⚙️ CONFIGURAÇÕES
const SENHA = "jukebox2026";
const SERVIDOR_URL = "https://servidor-jukebox.onrender.com";
const NOME_BOX = "jukebox_01";
const CHAVE = 'jukebox_dados';

// 📦 Dados da Jukebox
let jbs = [];

// 🔑 LOGIN
function entrar() {
  const s = document.getElementById('senha').value;
  if (s === SENHA) {
    document.getElementById('telaLogin').classList.add('hidden');
    document.getElementById('telaApp').classList.remove('hidden');
    carregar();
  } else {
    document.getElementById('msgErro').style.display = 'block';
  }
}

function sair() {
  document.getElementById('senha').value = '';
  document.getElementById('msgErro').style.display = 'none';
  document.getElementById('telaApp').classList.add('hidden');
  document.getElementById('telaLogin').classList.remove('hidden');
}

// 📂 CARREGAR DADOS SALVOS
function carregar() {
  const salvo = localStorage.getItem(CHAVE);
  if (salvo) {
    jbs = JSON.parse(salvo);
  } else {
    jbs = [{
      id: 'jb1',
      nome: 'Bar do Gil — Limoeiro',
      local: 'Limoeiro do Norte, CE',
      ip: '192.168.0.3',
      online: true,
      periodo: { total: 0, valor: 0, inicio: new Date().toLocaleDateString('pt-BR') },
      historico: []
    }];
    salvar();
  }
  mostrar();
}

function salvar() {
  localStorage.setItem(CHAVE, JSON.stringify(jbs));
}

// 🖥️ EXIBIR DADOS NA TELA
function mostrar() {
  const box = jbs[0];
  document.getElementById('nomeMaquina').textContent = box.nome;
  document.getElementById('ipMaquina').textContent = box.ip;
  document.getElementById('statusOnline').textContent = box.online ? '● Online' : '● Offline';
  document.getElementById('statusOnline').className = box.online ? 'online' : 'offline';
  document.getElementById('valorTotal').textContent = 'R$ ' + box.periodo.valor.toFixed(2).replace('.', ',');
  document.getElementById('exibeTotal').textContent = 'R$ ' + box.periodo.valor.toFixed(2).replace('.', ',');
  
  // Lista do histórico
  const lista = document.getElementById('listaHistorico');
  lista.innerHTML = '';
  
  if (box.historico.length === 0) {
    lista.innerHTML = '<p style="color:#777; font-style:italic;">Nenhum registro ainda...</p>';
  } else {
    box.historico.forEach(item => {
      lista.innerHTML = `
        <div class="item-hist">
          <span>${item.data}</span>
          <span style="color:#00d4ff">R$ ${item.valor.toFixed(2).replace('.', ',')}</span>
          <span>${item.pulsos} pulsos</span>
        </div>
      ` + lista.innerHTML;
    });
  }
}

// � ENVIAR PULSO PARA O SERVIDOR
async function enviarPulso(qtdPulsos, valor) {
  if (qtdPulsos <= 0) {
    alert('Digite um valor válido!');
    return;
  }
  
  try {
    const resposta = await fetch(`${SERVIDOR_URL}/api/teste-pulso?box=${NOME_BOX}&qtd=${qtdPulsos}`);
    const dados = await resposta.json();
    
    if (dados.sucesso) {
      // Registra no histórico local
      const box = jbs[0];
      box.historico.push({
        valor: valor,
        pulsos: qtdPulsos,
        data: new Date().toLocaleTimeString('pt-BR') + ' — ' + new Date().toLocaleDateString('pt-BR')
      });
      box.periodo.valor += valor;
      box.periodo.total += qtdPulsos;
      
      salvar();
      mostrar();
      
      // Feedback visual
      const botoes = document.querySelectorAll('.btn-valor');
      botoes.forEach(btn => btn.style.opacity = '0.5');
      setTimeout(() => {
        botoes.forEach(btn => btn.style.opacity = '1');
      }, 500);
    }
  } catch (erro) {
    alert('❌ Erro ao conectar com o servidor! Verifique se está online.');
    console.error(erro);
  }
}

// 🔄 ZERAR PERÍODO
function zerarPeriodo() {
  if (confirm('Tem certeza que deseja zerar o período?\nData de início será atualizada para hoje.')) {
    const box = jbs[0];
    box.periodo = {
      total: 0,
      valor: 0,
      inicio: new Date().toLocaleDateString('pt-BR')
    };
    box.historico = [];
    salvar();
    mostrar();
  }
}
</script>
</body>
</html>
