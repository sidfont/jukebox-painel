<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Pix — Painel Completo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background: linear-gradient(135deg, #0f0f1a, #1a1a30); min-height: 100vh; color: #fff; }
        .hidden { display: none !important; }
        
        /* ===== TELA DE LOGIN ===== */
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 40px 30px; border: 1px solid #00d9ff40; width: 100%; max-width: 400px; text-align: center; }
        .login-box h1 { color: #00d9ff; margin-bottom: 10px; font-size: 28px; }
        .login-box p { color: #888; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: #fff; font-size: 16px; outline: none; }
        .login-box input:focus { border-color: #00d9ff; }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(90deg, #00d9ff, #0088cc); border: none; border-radius: 8px; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .btn-primary:hover { transform: scale(1.02); }
        .erro-senha { color: #ff6666; margin-top: 10px; display: none; }
        
        /* ===== PAINEL PRINCIPAL ===== */
        .app-container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-bar h1 { color: #00d9ff; font-size: 24px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn-sair { background: transparent; border: 1px solid #ff6666; color: #ff6666; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-sair:hover { background: #ff6666; color: white; }
        
        .actions-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn-success { background: #00cc66; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-warning { background: #ff9900; color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #ff4444; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* ===== ADICIONAR JUKEBOX ===== */
        .add-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 25px; margin-bottom: 30px; border: 1px dashed #00d9ff40; }
        .add-card h3 { color: #00d9ff; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1a1a2e; color: #fff; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { border-color: #00d9ff; outline: none; }
        
        /* ===== LISTA DE JUKEBOXES ===== */
        .jukeboxes-grid { display: grid; gap: 20px; margin-bottom: 30px; }
        .jukebox-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; border: 1px solid #ffffff10; transition: border-color 0.3s; }
        .jukebox-card.online { border-color: #00ff8840; }
        .jukebox-card.offline { border-color: #ff444440; }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title h3 { font-size: 18px; margin-bottom: 4px; }
        .card-title p { font-size: 13px; color: #888; }
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.online { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .status-dot.offline { background: #ff4444; box-shadow: 0 0 8px #ff4444; }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 6px; text-align: center; }
        .stat-label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #00d9ff; }
        .stat-value.valor { color: #00ff88; }
        
        .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .mini-btn { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .mini-btn.v2 { background: #4CAF50; color: white; }
        .mini-btn.v5 { background: #2196F3; color: white; }
        .mini-btn.v10 { background: #FF9800; color: white; }
        .mini-btn.v20 { background: #9C27B0; color: white; }
        .mini-btn.v50 { background: #f44336; color: white; }
        .mini-btn.delete { background: #333; color: #888; margin-left: auto; }
        
        .log-mini { background: rgba(0,0,0,0.2); border-radius: 6px; padding: 10px; max-height: 100px; overflow-y: auto; font-size: 11px; font-family: monospace; }
        .log-line { padding: 2px 0; border-bottom: 1px solid #222; }
        .log-line.entrada { color: #00ff88; }
        .log-line.erro { color: #ff6666; }
        .log-line.info { color: #ffcc00; }
        
        /* ===== Zerar Período ===== */
        .reset-section { background: rgba(255,68,68,0.05); border: 1px solid #ff444430; border-radius: 12px; padding: 20px; margin-top: 30px; }
        .reset-section h3 { color: #ff6666; margin-bottom: 10px; font-size: 16px; }
        .reset-section p { font-size: 13px; color: #888; margin-bottom: 15px; }
        
        /* ===== RESPONSIVO ===== */
        @media(max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ======================================
        TELA DE LOGIN
    ======================================= -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>🎵 Jukebox Pix</h1>
            <p>Painel de Controle</p>
            <input type="password" id="senhaAcesso" placeholder="Digite sua senha de acesso">
            <button class="btn-primary" onclick="fazerLogin()">Entrar no Sistema</button>
            <div class="erro-senha" id="erroSenha">Senha incorreta. Tente novamente.</div>
        </div>
    </div>

    <!-- ======================================
        PAINEL PRINCIPAL
    ======================================= -->
    <div id="appScreen" class="app-container hidden">
        <div class="top-bar">
            <h1>🎵 Jukebox Pix — Painel de Controle</h1>
            <div class="user-info">
                <span id="dataAtual"></span>
                <button class="btn-sair" onclick="fazerLogout()">Sair</button>
            </div>
        </div>

        <!-- Adicionar Nova Jukebox -->
        <div class="add-card">
            <h3>➕ Adicionar Nova Jukebox</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome / Identificação</label>
                    <input type="text" id="nomeJukebox" placeholder="Ex: Bar do Gil">
                </div>
                <div class="form-group">
                    <label>Local / Endereço</label>
                    <input type="text" id="localJukebox" placeholder="Ex: Laginha de Quixere-CE">
                </div>
                <div class="form-group">
                    <label>Código da ESP32</label>
                    <input type="text" id="codigoJukebox" placeholder="Ex: jukebox_01">
                </div>
                <div class="form-group">
                    <label>IP da ESP32</label>
                    <input type="text" id="ipJukebox" placeholder="Ex: 192.168.0.14">
                </div>
            </div>
            <button class="btn-success" onclick="adicionarJukebox()">✅ Cadastrar Jukebox</button>
        </div>

        <!-- Ações Gerais -->
        <div class="actions-bar">
            <button class="btn-warning" onclick="verificarTodosStatus()">🔄 Verificar Status de Todas</button>
        </div>

        <!-- Lista de Jukeboxes -->
        <div id="listaJukeboxes" class="jukeboxes-grid">
            <!-- Os cards aparecem aqui automaticamente -->
        </div>

        <!-- Zerar Período -->
        <div class="reset-section">
            <h3>⚠️ Zerar Período / Recomeçar Contagem</h3>
            <p>Isso zera os valores acumulados de todas as jukeboxes, mantendo os cadastros. Use no início do mês ou quinzena.</p>
            <button class="btn-danger" onclick="if(confirm('Tem certeza? Isso apaga todo o histórico de valores de TODAS as jukeboxes!')){zerarTudo()}">🗑️ Zerar Todos os Valores</button>
        </div>
    </div>

    <script>
        // ============= CONFIGURAÇÃO =============
        const SENHA_SISTEMA = "jukebox2026";
        const ARMAZENAMENTO_CHAVE = "jukeboxPix_dados";
        
        let jukeboxes = [];

        // ============= LOGIN =============
        window.onload = function() {
            document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR');
            carregarDados();
        };

        function fazerLogin() {
            const senha = document.getElementById('senhaAcesso').value;
            if (senha === SENHA_SISTEMA) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                carregarDados();
                if (jukeboxes.length === 0) {
                    jukeboxes = [{
                        id: 'jb1',
                        nome: 'Bar do Gil',
                        local: 'Laginha de Quixere-CE',
                        codigo: 'jukebox_01',
                        ip: '192.168.0.14',
                        online: false,
                        totalEntradas: 0,
                        totalValor: 0,
                        historico: []
                    }];
                    salvarDados();
                    renderizarLista();
                }
                verificarTodosStatus();
            } else {
                document.getElementById('erroSenha').style.display = 'block';
            }
        }

        function fazerLogout() {
            document.getElementById('senhaAcesso').value = '';
            document.getElementById('erroSenha').style.display = 'none';
            document.getElementById('appScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        // ============= ARMAZENAMENTO =============
        function salvarDados() {
            localStorage.setItem(ARMAZENAMENTO_CHAVE, JSON.stringify(jukeboxes));
        }

        function carregarDados() {
            const dados = localStorage.getItem(ARMAZENAMENTO_CHAVE);
            if (dados) jukeboxes = JSON.parse(dados);
            renderizarLista();
        }

        // ============= JUKEBOXES =============
        function adicionarJukebox() {
            const nome = document.getElementById('nomeJukebox').value.trim();
            const local = document.getElementById('localJukebox').value.trim();
            const codigo = document.getElementById('codigoJukebox').value.trim();
            const ip = document.getElementById('ipJukebox').value.trim();
            
            if (!nome || !codigo || !ip) {
                alert('Preencha pelo menos Nome, Código e IP!');
                return;
            }
            
            const nova = {
                id: 'jb' + Date.now(),
                nome: nome,
                local: local,
                codigo: codigo,
                ip: ip,
                online: false,
                totalEntradas: 0,
                totalValor: 0,
                historico: []
            };
            
            jukeboxes.push(nova);
            salvarDados();
            renderizarLista();
            
            // Limpa os campos
            document.getElementById('nomeJukebox').value = '';
            document.getElementById('localJukebox').value = '';
            document.getElementById('codigoJukebox').value = '';
            document.getElementById('ipJukebox').value = '';
            
            verificarStatus(nova.id);
        }

        function removerJukebox(id) {
            if (confirm('Excluir esta jukebox?')) {
                jukeboxes = jukeboxes.filter(j => j.id !== id);
                salvarDados();
                renderizarLista();
            }
        }

        // ============= STATUS =============
        async function verificarStatus(id) {
            const jb = jukeboxes.find(j => j.id === id);
            if (!jb) return;
            
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 2500);
                const res = await fetch(`http://${jb.ip}/status`, { signal: ctrl.signal });
                clearTimeout(t);
                jb.online = res.ok;
            } catch {
                jb.online = false;
            }
            salvarDados();
            renderizarLista();
        }

        function verificarTodosStatus() {
            jukeboxes.forEach(jb => verificarStatus(jb.id));
        }

        // ============= ENVIAR PULSO DE TESTE =============
        async function enviarPulso(id, valor, pulsos) {
            const jb = jukeboxes.find(j => j.id === id);
            if (!jb) return;
            
            const agora = new Date();
            const hora = agora.toLocaleTimeString();
            
            jb.historico.unshift({
                hora: hora,
                valor: valor,
                pulsos: pulsos,
                tipo: 'teste'
            });
            jb.totalEntradas++;
            jb.totalValor += valor;
            
            salvarDados();
            renderizarLista();
            
            try {
                await fetch(`http://${jb.ip}/credito?valor=${valor}`);
            } catch {}
        }

        // ============= ZERAR =============
        function zerarTudo() {
            jukeboxes.forEach(jb => {
                jb.total
