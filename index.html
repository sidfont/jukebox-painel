<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00d9ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Jukebox Pix</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(180deg, #0f0f1a, #1a1a30); color: #fff; min-height: 100vh; padding-bottom: 30px; }
        .hidden { display: none !important; }
        
        /* ===== TELA DE LOGIN ===== */
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .login-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px 24px; border: 1px solid #00d9ff40; width: 100%; max-width: 360px; text-align: center; }
        
        .logo-img { max-width: 200px; margin-bottom: 10px; }
        .logo-text { font-size: 22px; font-weight: bold; color: #00d9ff; margin-bottom: 4px; }
        .logo-sub { font-size: 14px; color: #888; margin-bottom: 30px; }
        
        input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border-radius: 12px; border: 1px solid #333; background: #16213e; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #00d9ff; }
        button { border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: transform 0.15s, opacity 0.15s; }
        button:active { transform: scale(0.97); }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(90deg, #00d9ff, #0088cc); color: #000; font-size: 16px; }
        .erro-senha { color: #ff6666; margin-top: 12px; display: none; font-size: 14px; }
        
        /* ===== PAINEL PRINCIPAL ===== */
        .app-header { padding: 16px 20px; padding-top: 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px); }
        .app-logo-section { display: flex; align-items: center; gap: 10px; }
        .app-logo-small { height: 32px; width: auto; }
        .app-title { font-size: 18px; font-weight: bold; color: #00d9ff; }
        .btn-sair { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 8px 14px; font-size: 14px; border-radius: 8px; }
        .btn-sair:active { background: #ff4444; color: white; }
        
        .data-hoje { padding: 10px 20px; font-size: 13px; color: #888; }
        
        .container { padding: 0 16px; }
        
        /* ADICIONAR JUKEBOX */
        .add-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px dashed #00d9ff40; }
        .add-card h3 { color: #00d9ff; margin-bottom: 14px; font-size: 16px; }
        .form-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
        .form-grid input { margin: 0; font-size: 15px; }
        .btn-success { width: 100%; padding: 12px; background: #00cc66; color: white; font-size: 15px; }
        
        /* LISTA */
        .jb-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; margin-bottom: 14px; border-left: 3px solid #444; }
        .jb-card.online { border-left-color: #00ff88; }
        .jb-card.offline { border-left-color: #ff9900; }
        
        .jb-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .jb-name { font-size: 17px; font-weight: 600; }
        .jb-place { font-size: 12px; color: #888; margin-top: 2px; }
        .status-tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
        .status-tag.on { background: #00ff8820; color: #00ff88; }
        .status-tag.off { background: #ff990020; color: #ff9900; }
        
        .periodo-info { font-size: 12px; color: #666; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }
        .periodo-destaque { color: #ffcc00; font-weight: 600; }
        
        .jb-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .stat-box { background: rgba(0,0,0,0.25); padding: 12px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: bold; color: #00d9ff; }
        .stat-value.green { color: #00ff88; }
        
        .btn-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .btn-v { padding: 10px 4px; font-size: 13px; border-radius: 6px; font-weight: 600; }
        .btn-v.v2 { background: #4CAF50; color: white; }
        .btn-v.v5 { background: #2196F3; color: white; }
        .btn-v.v10 { background: #FF9800; color: white; }
        .btn-v.v20 { background: #9C27B0; color: white; }
        .btn-v.v50 { background: #f44336; color: white; }
        
        .mini-acoes { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-mini { padding: 8px 12px; font-size: 13px; border-radius: 6px; background: #2a2a4a; color: #ccc; }
        .btn-mini.zera { background: #ff990020; color: #ff9900; }
        .btn-mini.exclui { background: #ff444420; color: #ff4444; margin-left: auto; }
        
        .log-box { background: rgba(0,0,0,0.25); border-radius: 8px; padding: 12px; max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .log-line { padding: 4px 0; border-bottom: 1px solid #2a2a4a; }
        .log-time { color: #666; }
        .log-ok { color: #00ff88; }
        .log-empty { color: #555; font-style: italic; text-align: center; padding: 8px; }
        
        /* ZERAR GERAL */
        .zera-section { background: rgba(255,68,68,0.05); border: 1px solid #ff444430; border-radius: 16px; padding: 20px; margin-top: 30px; }
        .zera-section h3 { color: #ff4444; font-size: 16px; margin-bottom: 8px; }
        .zera-section p { font-size: 13px; color: #888; margin-bottom: 15px; line-height: 1.5; }
        .btn-zera-tudo { width: 100%; padding: 14px; background: #ff4444; color: white; font-size: 15px; }
        
        .empty-state { text-align: center; padding: 50px 20px; color: #555; font-size: 15px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="telaLogin" class="login-screen">
        <div class="login-box">
            <!-- ======================
               TROQUE AQUI PELA SUA LOGO
               Coloque o link da sua imagem entre as aspas de src=""
            ======================= -->
            <img src="logo.png" alt="Jukebox Pix" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">Jukebox Pix</div>
            <div class="logo-sub">Painel de Controle</div>
            <input type="password" id="senha" placeholder="Digite sua senha">
            <button class="btn-primary" onclick="entrar()">Entrar</button>
            <div class="erro-senha" id="msgErro">Senha incorreta</div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="telaApp" class="hidden">
        <div class="app-header">
            <div class="app-logo-section">
                <!-- ======================
                   TROQUE AQUI TAMBÉM
                   Mesmo link da logo acima
                ======================= -->
                <img src="logo.png" alt="Logo" class="app-logo-small" onerror="this.style.display='none'">
                <span class="app-title">Jukebox Pix</span>
            </div>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
        
        <div class="data-hoje" id="dataTopo"></div>
        
        <div class="container">
            <!-- ADICIONAR JUKEBOX -->
            <div class="add-card">
                <h3>➕ Adicionar Jukebox</h3>
                <div class="form-grid">
                    <input type="text" id="nome" placeholder="Nome do Cliente / Bar">
                    <input type="text" id="local" placeholder="Cidade / Local">
                    <input type="text" id="ip" placeholder="IP da ESP32">
                </div>
                <button class="btn-success" onclick="cadastrar()">✅ Cadastrar</button>
            </div>
            
            <!-- LISTA DE JUKEBOXES -->
            <div id="listaJb"></div>
            
            <!-- ZERAR TODAS -->
            <div class="zera-section">
                <h3>🗑️ Iniciar Novo Período — Todas as Jukeboxes</h3>
                <p>Zera os contadores de valor e entradas de <strong>todas</strong> as máquinas de uma vez. O histórico de pagamentos fica salvo para consulta. Use no dia de acerto quinzenal ou mensal.</p>
                <button class="btn-zera-tudo" onclick="if(confirm('⚠️ ATENÇÃO: Zerar contadores de TODAS as jukeboxes?\n\nO período atual vai fechar e começar do zero.\nO histórico de pagamentos fica salvo.\n\nConfirma?')){zerarTodas()}">🔄 Zerar Período de Todas</button>
            </div>
        </div>
    </div>

<script>
const SENHA = "jukebox2026";
const CHAVE = "jb_pix_dados_v2";
let jbs = [];

// DATA DE HOJE FORMATADA
const hoje = new Date();
const dataFormatada = hoje.toLocaleDateString('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
});
document.getElementById('dataTopo').textContent = dataFormatada;

// LOGIN
function entrar() {
    const s = document.getElementById('senha').value;
    if (s === SENHA) {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('telaApp').classList.remove('hidden');
        carregar();
        // DADOS DE EXEMPLO SE FOR PRIMEIRO ACESSO
        if (jbs.length === 0) {
            jbs = [{
                id: 'jb1',
                nome: 'Bar do Gil',
                local: 'Laginha de Quixere-CE',
                ip: '192.168.0.14',
                online: false,
                periodoAtual: {
                    total: 0,
                    valor: 0,
                    inicio: new Date().toLocaleDateString('pt-BR')
                },
                historicoPagamentos: []
            }];
            salvar();
            mostrar();
        }
    } else {
        document.getElementById('msgErro').style.display = 'block';
    }
}

function sair() {
    document.getElementById('senha').value = '';
    document.getElementById('msgErro').style.display = 'none';
    document.getElementById('telaApp').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
}

// SALVAR E CARREGAR DADOS
function salvar() {
    localStorage.setItem(CHAVE, JSON.stringify(jbs));
}
function carregar() {
    const dadosSalvos = localStorage.getItem(CHAVE);
    if (dadosSalvos) {
        jbs = JSON.parse(dadosSalvos);
    }
    mostrar();
}

// CADASTRAR NOVA JUKEBOX
function cadastrar() {
    const nome = document.getElementById('nome').value.trim();
    const local = document.getElementById('local').value.trim();
    const ip = document.getElementById('ip').value.trim();
    
    if (!nome || !ip) {
        alert('⚠️ Preencha pelo menos o Nome e o IP!');
        return;
    }
    
    const novaJukebox = {
        id: 'jb' + Date.now(),
        nome: nome,
        local: local,
        ip: ip,
        online: false,
        periodoAtual: {
            total: 0,
            valor: 0,
            inicio: new Date().toLocaleDateString('pt-BR')
        },
        historicoPagamentos: []
    };
    
    jbs.push(novaJukebox);
    salvar();
    mostrar();
    
    // LIMPAR CAMPOS
    document.getElementById('nome').value = '';
    document.getElementById('local').value = '';
    document.getElementById('ip').value = '';
    
    alert('✅ Jukebox cadastrada com sucesso!');
}

// EXCLUIR JUKEBOX
function remover(id) {
    if (confirm('⚠️ Tem certeza?\n\nEsta jukebox e TODO o histórico dela serão apagados permanentemente!')) {
        jbs = jbs.filter(jb => jb.id !== id);
        salvar();
        mostrar();
    }
}

// ZERAR PERÍODO — SÓ UMA JUKEBOX
function zerarUmPeriodo(id) {
    if (confirm('🔄 Iniciar NOVO PERÍODO para esta jukebox?\n\nOs contadores voltam a zero.\nO histórico de pagamentos fica salvo.\n\nConfirma?')) {
        const jb = jbs.find(j => j.id === id);
        if (jb) {
            jb.periodoAtual = {
                total: 0,
                valor: 0,
                inicio: new Date().toLocaleDateString('pt-BR')
            };
            salvar();
            mostrar();
        }
    }
}

// ZERAR PERÍODO — TODAS AS JUKEBOXES
function zerarTodas() {
    jbs.forEach(jb => {
        jb.periodoAtual = {
            total: 0,
            valor: 0,
            inicio: new Date().toLocaleDateString('pt-BR')
        };
    });
    salvar();
    mostrar();
    alert('✅ Novo período iniciado para todas as jukeboxes!\n\nContadores zerados.\nHistórico salvo.');
}

// ENVIAR CRÉDITO / REGISTRAR PAGAMENTO
async function enviar(id, valor, pulsos) {
    const jb = jbs.find(j => j.id === id);
    if (!jb) return;
    
    const agora = new Date();
    const dataHora = agora.toLocaleTimeString('pt-BR');
    const data = agora.toLocaleDateString('pt-BR');
    
    // ATUALIZA CONTADORES DO PERÍODO
    jb.periodoAtual.total++;
    jb.periodoAtual.valor += valor;
    
    // SALVA NO HISTÓRICO COMPLETO
    jb.historicoPagamentos.unshift({
        data: data,
        hora: dataHora,
        valor: valor,
        pulsos: pulsos
    });
    
    // LIMPA HISTÓRICO MUITO ANTIGO (mantém últimos 30 registros)
    if (jb.historicoPagamentos.length > 30) {
        jb.historicoPagamentos.pop();
    }
    
    salvar();
    mostrar();
    
    // TENTA ENVIAR PARA A ESP32
    try {
        await fetch(`http://${jb.ip}/credito?valor=${valor}`);
    } catch (erro) {
        // Se não conseguir conectar, só registra no painel
    }
}

// RENDERIZAR LISTA DE JUKEBOXES
function mostrar() {
    const lista = document.getElementById('listaJb');
    
    if (jbs.length === 0) {
        lista.innerHTML = '<div class="empty-state">🎵 Nenhuma jukebox cadastrada ainda.<br><br>Preencha os dados acima e clique em "Cadastrar" para começar!</div>';
        return;
    }
    
    lista.innerHTML = jbs.map(jb => {
        const p = jb.periodoAtual || { total: 0, valor: 0, inicio: '-' };
        const historico = jb.historicoPagamentos || [];
        
        return `
        <div class="jb-card ${jb.online?'online':'offline'}">
            <div class="jb-top">
                <div>
