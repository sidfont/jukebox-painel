<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Pix — Painel de Controle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #00d9ff; }
        .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(0,217,255,0.2); }
        .jukebox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; background: #555; }
        .status-dot.online { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .status-dot.offline { background: #ff4444; box-shadow: 0 0 10px #ff4444; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .info-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; }
        .info-label { font-size: 12px; color: #aaa; }
        .info-value { font-weight: bold; color: #00d9ff; }
        .test-section { margin-top: 20px; }
        .test-section h3 { margin-bottom: 12px; color: #ffcc00; }
        .btn-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        button { padding: 12px 8px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-2 { background: #4CAF50; color: white; }
        .btn-5 { background: #2196F3; color: white; }
        .btn-10 { background: #FF9800; color: white; }
        .btn-20 { background: #9C27B0; color: white; }
        .btn-50 { background: #f44336; color: white; }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .log-section { margin-top: 25px; }
        .log-section h3 { margin-bottom: 12px; color: #00d9ff; }
        .log-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .log-entry { padding: 6px 0; border-bottom: 1px solid #333; }
        .log-time { color: #888; }
        .log-success { color: #00ff88; }
        .log-error { color: #ff6666; }
        .log-info { color: #ffcc00; }
        .refresh-btn { background: #00d9ff; color: #000; margin-bottom: 15px; }
        .empty-state { text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Jukebox Pix — Painel de Controle</h1>

        <!-- Jukebox Card -->
        <div class="card">
            <div class="jukebox-header">
                <h2>Bar do Gil — Jukebox-01</h2>
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Verificando...</span>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Local</div>
                    <div class="info-value">Laginha de Quixere-CE</div>
                </div>
                <div class="info-item">
                    <div class="info-label">IP da ESP32</div>
                    <div class="info-value" id="ipDisplay">192.168.0.14</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Código</div>
                    <div class="info-value">jukebox_01</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Última verificação</div>
                    <div class="info-value" id="lastCheck">--:--:--</div>
                </div>
            </div>

            <!-- Test Buttons -->
            <div class="test-section">
                <h3>🧪 Enviar Crédito de Teste</h3>
                <div class="btn-grid">
                    <button class="btn-2" onclick="enviarTeste(2.00)">R$ 2,00<br>2 pulsos</button>
                    <button class="btn-5" onclick="enviarTeste(5.00)">R$ 5,00<br>5 pulsos</button>
                    <button class="btn-10" onclick="enviarTeste(10.00)">R$ 10,00<br>10 pulsos</button>
                    <button class="btn-20" onclick="enviarTeste(20.00)">R$ 20,00<br>20 pulsos</button>
                    <button class="btn-50" onclick="enviarTeste(50.00)">R$ 50,00<br>50 pulsos</button>
                </div>
            </div>

            <!-- Log / Histórico -->
            <div class="log-section">
                <h3>📋 Histórico de Operações</h3>
                <button class="refresh-btn" onclick="limparLog()">Limpar Histórico</button>
                <div class="log-box" id="logBox">
                    <div class="empty-state">Nenhuma operação registrada ainda.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO — coloque o IP correto aqui
        const IP_JUKEBOX = '192.168.0.14';
        let historico = [];

        // Inicialização
        window.onload = function() {
            verificarStatus();
            setInterval(verificarStatus, 30000); // Verifica a cada 30 segundos
        };

        // Verificar se está online
        async function verificarStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const time = document.getElementById('lastCheck');
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                
                const resposta = await fetch(`http://${IP_JUKEBOX}/status`, { 
                    signal: controller.signal,
                    mode: 'cors'
                });
                clearTimeout(timeoutId);
                
                if (resposta.ok) {
                    dot.classList.add('online');
                    dot.classList.remove('offline');
                    text.textContent = 'ONLINE ✅';
                    adicionarLog('info', 'Sistema verificado — Online');
                }
            } catch (erro) {
                dot.classList.remove('online');
                dot.classList.add('offline');
                text.textContent = 'OFFLINE ❌';
                adicionarLog('error', 'Sistema offline ou fora da rede');
            }
            
            const agora = new Date();
            time.textContent = agora.toLocaleTimeString();
        }

        // Enviar teste de crédito
        async function enviarTeste(valor) {
            adicionarLog('info', `Solicitando R$ ${valor.toFixed(2).replace('.', ',')}...`);
            
            try {
                const resposta = await fetch(`http://${IP_JUKEBOX}/credito?valor=${valor}`, { mode: 'cors' });
                const texto = await resposta.text();
                
                if (texto.includes('pulsos enviados')) {
                    adicionarLog('success', `✅ R$ ${valor.toFixed(2).replace('.', ',')} — ${texto}`);
                } else if (texto === 'VALOR_INVALIDO') {
                    adicionarLog('error', '❌ Valor não permitido — nenhum pulso enviado');
                } else {
                    adicionarLog('info', `Resposta: ${texto}`);
                }
            } catch (erro) {
                adicionarLog('error', '❌ Erro de comunicação — verifique se está na mesma rede Wi-Fi');
            }
        }

        // Adicionar entrada no log
        function adicionarLog(tipo, mensagem) {
            const logBox = document.getElementById('logBox');
            const agora = new Date();
            const hora = agora.toLocaleTimeString();
            
            // Remove mensagem de "vazio" se existir
            const vazio = logBox.querySelector('.empty-state');
            if (vazio) vazio.remove();
            
            const entrada = document.createElement('div');
            entrada.className = 'log-entry';
            
            let classeCor = '';
            if (tipo === 'success') classeCor = 'log-success';
            else if (tipo === 'error') classeCor = 'log-error';
            else classeCor = 'log-info';
            
            entrada.innerHTML = `
                <span class="log-time">[${hora}]</span>
                <span class="${classeCor}">${mensagem}</span>
            `;
            
            logBox.insertBefore(entrada, logBox.firstChild);
            historico.unshift({ hora, mensagem, tipo });
            
            // Limita a 50 entradas
            while (logBox.children.length > 50) {
                logBox.removeChild(logBox.lastChild);
            }
        }

        // Limpar histórico
        function limparLog() {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = '<div class="empty-state">Nenhuma operação registrada ainda.</div>';
            historico = [];
        }
    </script>
</body>
</html>
