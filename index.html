<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Brasil - Painel de Controle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #333; }
        h1 { font-size: 2rem; color: #00ff88; }
        .status-card { background: #16213e; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .btn { background: #00ff88; color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin: 5px; transition: 0.2s; }
        .btn:hover { background: #00cc6a; transform: scale(1.02); }
        .btn-secondary { background: #0f3460; color: white; }
        .btn-secondary:hover { background: #164b8a; }
        .jukebox-list { margin-top: 30px; }
        .jukebox-card { background: #16213e; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #00ff88; }
        .jukebox-card h3 { margin-bottom: 10px; color: #00ff88; }
        .jukebox-card p { margin: 5px 0; color: #ccc; }
        .online { color: #00ff88; font-weight: bold; }
        .offline { color: #ff6b6b; font-weight: bold; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input, input[type="text"], input[type="number"] { 
            width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #333; 
            background: #0f3460; color: white; font-size: 1rem; 
        }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #16213e; padding: 30px; border-radius: 10px; max-width: 500px; width: 90%; }
        .modal-content h2 { margin-bottom: 20px; color: #00ff88; }
        .close-btn { float: right; background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        .header-actions { text-align: right; margin-bottom: 20px; }
        .empty-state { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Jukebox Brasil</h1>
            <p>Painel de Controle e Gerenciamento</p>
        </header>

        <div class="header-actions">
            <button class="btn" onclick="abrirModalCadastro()">+ Nova Jukebox</button>
        </div>

        <!-- Status Geral -->
        <div class="status-card">
            <h2>📊 Status do Sistema</h2>
            <p>Servidor: <span class="online">● Online</span></p>
            <p>Total de Máquinas: <span id="total-maquinas">0</span></p>
            <p>Créditos Disponíveis: R$ <span id="total-creditos">0,00</span></p>
        </div>

        <!-- Lista de Jukeboxes -->
        <div class="jukebox-list">
            <h2>📍 Minhas Jukeboxes</h2>
            <div id="lista-jukeboxes">
                <p class="empty-state">Nenhuma jukebox cadastrada ainda.</p>
            </div>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div id="modal-cadastro" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="fecharModalCadastro()">&times;</button>
            <h2>Cadastrar Jukebox</h2>
            <div class="form-group">
                <label>Nome / Identificação</label>
                <input type="text" id="jukebox-nome" placeholder="Ex: Bar do Gil - Limoeiro">
            </div>
            <div class="form-group">
                <label>Endereço IP da Máquina</label>
                <input type="text" id="jukebox-ip" placeholder="Ex: 192.168.0.6">
            </div>
            <div class="form-group">
                <label>Localização / Cliente</label>
                <input type="text" id="jukebox-local" placeholder="Ex: Limoeiro do Norte, CE">
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-secondary" onclick="fecharModalCadastro()">Cancelar</button>
                <button class="btn" onclick="salvarJukebox()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let jukeboxes = [];

        // Carregar dados salvos
        function carregarDados() {
            const salvos = localStorage.getItem('jukeboxes');
            if (salvos) {
                jukeboxes = JSON.parse(salvos);
                atualizarLista();
            }
        }

        // Salvar no navegador
        function salvarDados() {
            localStorage.setItem('jukeboxes', JSON.stringify(jukeboxes));
        }

        // Abrir/fechar modal
        function abrirModalCadastro() {
            document.getElementById('modal-cadastro').classList.add('active');
        }

        function fecharModalCadastro() {
            document.getElementById('modal-cadastro').classList.remove('active');
            document.getElementById('jukebox-nome').value = '';
            document.getElementById('jukebox-ip').value = '';
            document.getElementById('jukebox-local').value = '';
        }

        // Salvar nova jukebox
        function salvarJukebox() {
            const nome = document.getElementById('jukebox-nome').value.trim();
            const ip = document.getElementById('jukebox-ip').value.trim();
            const local = document.getElementById('jukebox-local').value.trim();

            if (!nome || !ip) {
                alert('Preencha o nome e o IP da jukebox!');
                return;
            }

            const nova = {
                id: Date.now(),
                nome: nome,
                ip: ip,
                local: local,
                online: true,
                creditos: 0
            };

            jukeboxes.push(nova);
            salvarDados();
            atualizarLista();
            fecharModalCadastro();
        }

        // Excluir jukebox
        function excluirJukebox(id) {
            if (confirm('Tem certeza que deseja excluir esta jukebox?')) {
                jukeboxes = jukeboxes.filter(j => j.id !== id);
                salvarDados();
                atualizarLista();
            }
        }

        // Atualizar lista na tela
        function atualizarLista() {
            const container = document.getElementById('lista-jukeboxes');
            const totalMaq = document.getElementById('total-maquinas');
            const totalCred = document.getElementById('total-creditos');

            totalMaq.textContent = jukeboxes.length;
            totalCred.textContent = jukeboxes.reduce((s, j) => s + j.creditos, 0).toFixed(2);

            if (jukeboxes.length === 0) {
                container.innerHTML = '<p class="empty-state">Nenhuma jukebox cadastrada ainda.</p>';
                return;
            }

            container.innerHTML = jukeboxes.map(j => `
                <div class="jukebox-card">
                    <h3>${j.nome} <span class="${j.online ? 'online' : 'offline'}">${j.online ? '● Online' : '● Offline'}</span></h3>
                    <p><strong>IP:</strong> ${j.ip}</p>
                    <p><strong>Local:</strong> ${j.local || 'Não informado'}</p>
                    <p><strong>Créditos:</strong> R$ ${j.creditos.toFixed(2)}</p>
                    <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.9rem;" onclick="excluirJukebox(${j.id})">🗑️ Excluir</button>
                </div>
            `).join('');
        }

        // Iniciar
        carregarDados();
    </script>
</body>
</html>
