<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Pix — Painel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #1a1a2e; color: #fff; min-height: 100vh; }
        .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { background: rgba(255,255,255,0.05); padding: 40px 30px; border-radius: 12px; border: 1px solid #00d9ff40; width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #00d9ff; margin-bottom: 10px; }
        input { width: 100%; padding: 14px; margin: 20px 0; border-radius: 8px; border: 1px solid #333; background: #16213e; color: #fff; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #00d9ff; border: none; border-radius: 8px; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b8e6; }
        .erro { color: #ff6666; margin-top: 10px; display: none; }
        .hidden { display: none !important; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sair { width: auto; padding: 8px 16px; background: #ff4444; color: #fff; }
        .linha { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 10px 0; }
        input.sm { padding: 8px; margin: 0; }
        .btn-gr { background: #00cc66; margin: 10px 0; }
        .btn-gr:hover { background: #00b359; }
        .jb-card { background: rgba(0,0,0,0.25); padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 3px solid #555; }
        .jb-card.online { border-left-color: #00ff88; }
        .jb-card.offline { border-left-color: #ff4444; }
        .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .status.on { background: #00ff88; }
        .status.off { background: #ff4444; }
        .botoes { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
        .b { padding: 6px 10px; font-size: 13px; width: auto; }
        .b2 { background: #4CAF50; color: #fff; }
        .b5 { background: #2196F3; color: #fff; }
        .b10 { background: #FF9800; color: #fff; }
        .b20 { background: #9C27B0; color: #fff; }
        .b50 { background: #f44336; color: #fff; }
        .log { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-top: 10px; font-family: monospace; font-size: 12px; max-height: 120px; overflow-y: auto; }
        .log-line { padding: 3px 0; border-bottom: 1px solid #222; }
        .ok { color: #00ff88; }
        .aviso { color: #ffcc00; }
        .del { background: #444; color: #888; margin-left: auto; }
        .zera { margin-top: 30px; padding: 15px; border: 1px solid #ff444440; background: rgba(255,68,68,0.05); border-radius: 8px; }
        .zera button { background: #ff4444; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="telaLogin" class="center">
        <div class="box">
            <h1>🎵 Jukebox Pix</h1>
            <p>Painel de Controle</p>
            <input type="password" id="senha" placeholder="Digite a senha">
            <button onclick="entrar()">Entrar</button>
            <div class="erro" id="msgErro">Senha incorreta</div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="telaApp" class="hidden">
        <div class="container">
            <div class="top">
                <h1>🎵 Jukebox Pix</h1>
                <button class="sair" onclick="sair()">Sair</button>
            </div>

            <!-- ADICIONAR JUKEBOX -->
            <div class="card">
                <h3>➕ Adicionar Jukebox</h3>
                <div class="linha">
                    <input class="sm" type="text" id="nome" placeholder="Nome">
                    <input class="sm" type="text" id="local" placeholder="Local">
                    <input class="sm" type="text" id="ip" placeholder="IP">
                </div>
                <button class="btn-gr" onclick="cadastrar()">✅ Cadastrar</button>
            </div>

            <!-- LISTA -->
            <div id="lista"></div>

            <!-- ZERAR -->
            <div class="zera">
                <h3>⚠️ Zerar Período</h3>
                <p>Apaga os valores acumulados de todas as jukeboxes</p>
                <button onclick="if(confirm('Tem certeza?')){zerarTudo()}">🗑️ Zerar Tudo</button>
            </div>
        </div>
    </div>

<script>
const SENHA = "jukebox2026";
const CHAVE = "jb_dados";
let jbs = [];

// LOGIN
function entrar() {
    const s = document.getElementById('senha').value;
    if (s === SENHA) {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('telaApp').classList.remove('hidden');
        carregar();
        if (jbs.length === 0) {
            jbs = [{id:'jb1',nome:'Bar do Gil',local:'Laginha de Quixere-CE',ip:'192.168.0.14',cod:'jukebox_01',online:false,total:0,valor:0,log:[]}];
            salvar();
            mostrar();
        }
        verificarTodos();
    } else {
        document.getElementById('msgErro').style.display = 'block';
    }
}

function sair() {
    document.getElementById('senha').value = '';
    document.getElementById('msgErro').style.display = 'none';
    document.getElementById('telaApp').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
}

// ARMAZENAMENTO
function salvar() { localStorage.setItem(CHAVE, JSON.stringify(jbs)); }
function carregar() { const d = localStorage.getItem(CHAVE); if(d) jbs = JSON.parse(d); mostrar(); }

// CADASTRAR
function cadastrar() {
    const nome = document.getElementById('nome').value.trim();
    const local = document.getElementById('local').value.trim();
    const ip = document.getElementById('ip').value.trim();
    if(!nome || !ip) { alert('Preencha Nome e IP!'); return; }
    jbs.push({id:'jb'+Date.now(), nome:nome, local:local, ip:ip, cod:'', online:false, total:0, valor:0, log:[]});
    salvar(); mostrar();
    document.getElementById('nome').value='';
    document.getElementById('local').value='';
    document.getElementById('ip').value='';
}

// REMOVER
function remover(id) {
    if(confirm('Excluir?')) { jbs = jbs.filter(j=>j.id!==id); salvar(); mostrar(); }
}

// VERIFICAR STATUS
async function checar(id) {
    const jb = jbs.find(j=>j.id===id);
    if(!jb) return;
    try {
        const c = new AbortController();
        const t = setTimeout(()=>c.abort(), 2000);
        const r = await fetch(`http://${jb.ip}/status`, {signal:c.signal});
        clearTimeout(t);
        jb.online = r.ok;
    } catch { jb.online = false; }
    salvar(); mostrar();
}

function verificarTodos() { jbs.forEach(j=>checar(j.id)); }

// ENVIAR CRÉDITO
async function enviar(id, val, qtd) {
    const jb = jbs.find(j=>j.id===id);
    if(!jb) return;
    const hora = new Date().toLocaleTimeString();
    jb.log.unshift({t:hora, v:val, q:qtd});
    jb.total++;
    jb.valor += val;
    salvar(); mostrar();
    try { await fetch(`http://${jb.ip}/credito?valor=${val}`); } catch {}
}

// ZERAR
function zerarTudo() {
    jbs.forEach(j=>{ jb.total=0; jb.valor=0; jb.log=[]; });
    salvar(); mostrar();
}

// RENDERIZAR
function mostrar() {
    const lista = document.getElementById('lista');
    if(jbs.length===0) {
        lista.innerHTML = '<p style="text-align:center;color:#666;padding:20px">Nenhuma jukebox cadastrada</p>';
        return;
    }
    lista.innerHTML = jbs.map(j=>`
        <div class="jb-card ${j.online?'online':'offline'}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <strong>${j.nome}</strong>
                <span><span class="status ${j.online?'on':'off'}"></span>${j.online?'ONLINE':'OFFLINE'}</span>
            </div>
            <p style="font-size:13px;color:#888">📍 ${j.local} • IP: ${j.ip}</p>
            <p style="margin:8px 0">💰 Entradas: ${j.total} | Total: R$ ${j.valor.toFixed(2).replace('.',',')}</p>
            <div class="botoes">
                <button class="b b2" onclick="enviar('${j.id}',2.00,2)">R$2</button>
                <button class="b b5" onclick="enviar('${j.id}',5.00,5)">R$5</button>
                <button class="b b10" onclick="enviar('${j.id}',10.00,10)">R$10</button>
                <button class="b b20" onclick="enviar('${j.id}',20.00,20)">R$20</button>
                <button class="b b50" onclick="enviar('${j.id}',50.00,50)">R$50</button>
                <button class="b del" onclick="remover('${j.id}')">🗑️</button>
            </div>
            <div class="log">
                ${j.log.length===0?'<span class="aviso">Sem registros ainda</span>':
                    j.log.slice(0,8).map(l=>`<div class="log-line"><span class="aviso">[${l.t}]</span> R$ ${l.v.toFixed(2).replace('.',',')} → ${l.q} pulsos</div>`).join('')
                }
            </div>
        </div>
    `).join('');
}
</script>
</body>
</html>
