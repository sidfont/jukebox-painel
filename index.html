<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Pix — Painel de Controle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: white; }
    .escondido { display: none !important; }
    
    /* Tela de Login */
    #tela-login {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .caixa-login {
      background: rgba(255,255,255,0.05);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    .caixa-login h1 { margin-bottom: 30px; color: #00d4ff; font-size: 24px; }
    .caixa-login input {
      width: 100%;
      padding: 14px;
      margin: 10px 0 20px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: rgba(255,255,255,0.1);
      color: white;
      outline: none;
    }
    .caixa-login button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      background: #00d4ff;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
    }
    .caixa-login button:hover { transform: scale(1.02); }
    .erro-senha {
      color: #ff6b6b;
      margin-top: 10px;
      display: none;
    }
    
    /* Tela Principal */
    header {
      background: rgba(0,0,0,0.3);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 18px; color: #00d4ff; }
    header button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #e74c3c;
      color: white;
      cursor: pointer;
    }
    .conteudo { padding: 20px; max-width: 500px; margin: 0 auto; }
    
    /* Botão Adicionar */
    .btn-adicionar {
      width: 100%;
      padding: 16px;
      border: 2px dashed #00d4ff;
      background: rgba(0,212,255,0.1);
      color: #00d4ff;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    
    /* Card de Máquina */
    .card-maquina {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .nome-maquina {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .status-online { color: #4cd137; font-size: 14px; }
    .info-maquina { font-size: 13px; color: #888; margin-bottom: 12px; }
    
    /* Botões de Valor */
    .grade-botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    .btn-valor {
      padding: 12px 8px;
      border: none;
      border-radius: 6px;
      background: #00d4ff;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.1s;
    }
    .btn-valor:active { transform: scale(0.97); }
    
    /* Botões pequenos */
    .grupo-botoes { margin-top: 10px; }
    .btn-pequeno {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .btn-editar { background: #f39c12; color: white; }
    .btn-zerar { background: #3498db; color: white; }
    .btn-excluir { background: #e74c3c; color: white; }
    
    /* Histórico */
    .historico { margin-top: 16px; }
    .historico h4 { font-size: 14px; color: #777; margin-bottom: 8px; }
    .item-hist {
      background: rgba(255,255,255,0.02);
      padding: 8px 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .total-box {
      background: rgba(0,212,255,0.1);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      color: #00d4ff;
    }
    
    /* Modal */
    .fundo-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .caixa-modal {
      background: #1a1a2e;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
    }
    .caixa-modal h3 { color: #00d4ff; margin-bottom: 16px; }
    .caixa-modal input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
    }
    .botoes-modal {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }
    .botoes-modal button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-cancelar { background: #555; color: white; }
    .btn-salvar { background: #4cd137; color: #000; }
  </style>
</head>
<body>

<!-- Tela de Login -->
<div id="tela-login">
  <div class="caixa-login">
    <h1>🎵 Jukebox Pix</h1>
    <input type="password" id="campo-senha" placeholder="Digite a senha...">
    <button onclick="verificarSenha()">Entrar</button>
    <div class="erro-senha" id="aviso-erro">Senha incorreta! Tente novamente.</div>
  </div>
</div>

<!-- Tela Principal -->
<div id="tela-principal" class="escondido">
  <header>
    <h1>🎵 Jukebox Pix</h1>
    <button onclick="sairDoSistema()">Sair</button>
  </header>
  
  <div class="conteudo">
    <button class="btn-adicionar" onclick="abrirModalCadastro()">➕ Cadastrar Nova Jukebox</button>
    <div id="lista-maquinas"></div>
  </div>
</div>

<!-- Modal de Cadastro -->
<div id="modal-cadastro" class="fundo-modal escondido">
  <div class="caixa-modal">
    <h3 id="titulo-modal">Cadastrar Jukebox</h3>
    <input type="text" id="input-nome" placeholder="Nome / Nome do Bar">
    <input type="text" id="input-local" placeholder="Cidade / Local">
    <input type="text" id="input-id" placeholder="ID (ex: jukebox_01)">
    <input type="text" id="input-ip" placeholder="IP (ex: 192.168.0.3)">
    <div class="botoes-modal">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarMaquina()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ⚙️ CONFIGURAÇÕES
const SENHA_CORRETA = "jukebox2026";
const SERVIDOR = "https://servidor-jukebox.onrender.com";
const CHAVE_ARMAZENAMENTO = "jukebox_dados";

let maquinas = [];
let editandoAgora = null;

// 🔑 LOGIN
function verificarSenha() {
  const senhaDigitada = document.getElementById('campo-senha').value;
  if (senhaDigitada === SENHA_CORRETA) {
    document.getElementById('tela-login').classList.add('escondido');
    document.getElementById('tela-principal').classList.remove('escondido');
    carregarDadosSalvos();
  } else {
    document.getElementById('aviso-erro').style.display = 'block';
  }
}

function sairDoSistema() {
  document.getElementById('campo-senha').value = '';
  document.getElementById('aviso-erro').style.display = 'none';
  document.getElementById('tela-principal').classList.add('escondido');
  document.getElementById('tela-login').classList.remove('escondido');
}

// 📂 CARREGAR E SALVAR
function carregarDadosSalvos() {
  const dadosSalvos = localStorage.getItem(CHAVE_ARMAZENAMENTO);
  if (dadosSalvos) {
    maquinas = JSON.parse(dadosSalvos);
  } else {
    // Dados iniciais — sua primeira máquina
    maquinas = [{
      id: 'jukebox_01',
      nome: 'Bar do Gil',
      local: 'Limoeiro do Norte, CE',
      ip: '192.168.0.3',
      periodo: { totalPulsos: 0, valorTotal: 0, inicio: new Date().toLocaleDateString('pt-BR') },
      historico: []
    }];
    salvarTudo();
  }
  atualizarLista();
}

function salvarTudo() {
  localStorage.setItem(CHAVE_ARMAZENAMENTO, JSON.stringify(maquinas));
}

// 📝 MODAL
function abrirModalCadastro(maquina = null) {
  editandoAgora = maquina ? maquina.id : null;
  document.getElementById('titulo-modal').textContent = maquina ? 'Editar Jukebox' : 'Cadastrar Jukebox';
  document.getElementById('input-nome').value = maquina ? maquina.nome : '';
  document.getElementById('input-local').value = maquina ? maquina.local : '';
  document.getElementById('input-id').value = maquina ? maquina.id : '';
  document.getElementById('input-id').disabled = maquina ? true : false;
  document.getElementById('input-ip').value = maquina ? maquina.ip : '';
  document.getElementById('modal-cadastro').classList.remove('escondido');
}

function fecharModal() {
  document.getElementById('modal-cadastro').classList.add('escondido');
  editandoAgora = null;
}

function salvarMaquina() {
  const nome = document.getElementById('input-nome').value.trim();
  const local = document.getElementById('input-local').value.trim();
  const id = document.getElementById('input-id').value.trim();
  const ip = document.getElementById('input-ip').value.trim();
  
  if (!nome || !id || !ip) {
    alert('Preencha nome, ID e IP!');
    return;
  }
  
  if (editandoAgora) {
    // Editar
    const indice = maquinas.findIndex(m => m.id === editandoAgora);
    if (indice !== -1) {
      maquinas[indice].nome = nome;
      maquinas[indice].local = local;
      maquinas[indice].ip = ip;
    }
  } else {
    // Adicionar nova
    maquinas.push({
      id: id,
      nome: nome,
      local: local,
      ip: ip,
      periodo: { totalPulsos: 0, valorTotal: 0, inicio: new Date().toLocaleDateString('pt-BR') },
      historico: []
    });
  }
  
  salvarTudo();
  fecharModal();
  atualizarLista();
}

// 🗑️ EXCLUIR
function excluirMaquina(id) {
  if (confirm('Excluir esta Jukebox? O histórico será perdido!')) {
    maquinas = maquinas.filter(m => m.id !== id);
    salvarTudo();
    atualizarLista();
  }
}

// 🔄 ZERAR PERÍODO
function zerarPeriodo(id) {
  if (confirm('Zerar o período desta máquina? Histórico apagado.')) {
    const indice = maquinas.findIndex(m => m.id === id);
    if (indice !== -1) {
      maquinas[indice].periodo = { totalPulsos: 0, valorTotal: 0, inicio: new Date().toLocaleDateString('pt-BR') };
      maquinas[indice].historico = [];
      salvarTudo();
      atualizarLista();
    }
  }
}

// ⚡ ENVIAR PULSO
async function enviarValor(idMaquina, quantidadePulsos, valorReais) {
  try {
    const resposta = await fetch(`${SERVIDOR}/api/teste-pulso?box=${idMaquina}&qtd=${quantidadePulsos}`);
    const dados = await resposta.json();
    
    if (dados.sucesso || dados.ok) {
      const indice = maquinas.findIndex(m => m.id === idMaquina);
      if (indice !== -1) {
        maquinas[indice].historico.push({
          valor: valorReais,
          pulsos: quantidadePulsos,
          data: new Date().toLocaleTimeString('pt-BR') + ' — ' + new Date().toLocaleDateString('pt-BR')
        });
        maquinas[indice].periodo.valorTotal += valorReais;
        maquinas[indice].periodo.totalPulsos += quantidadePulsos;
        salvarTudo();
        atualizarLista();
      }
    }
  } catch (erro) {
    alert('❌ Erro ao enviar! Verifique se o servidor está online.');
    console.error(erro);
  }
}

// 🖥️ MOSTRAR TUDO NA TELA
function atualizarLista() {
  const lista = document.getElementById('lista-maquinas');
  
  if (maquinas.length === 0) {
    lista.innerHTML = '<p style="text-align:center; color:#666; padding:20px;">Nenhuma Jukebox cadastrada ainda.</p>';
    return;
  }
  
  lista.innerHTML = '';
  
  maquinas.forEach(maquina => {
    lista.innerHTML += `
      <div class="card-maquina">
        <div class="nome-maquina">
          ${maquina.nome}
          <span class="status-online">● Online</span>
        </div>
        <div class="info-maquina">
          📍 ${maquina.local} • IP: ${maquina.ip}<br>
          📊 Total: R$ ${maquina.periodo.valorTotal.toFixed(2).replace('.', ',')}
        </div>
        
        <div class="grade-botoes">
          <button class="btn-valor" onclick="enviarValor('${maquina.id}', 2, 2.00)">R$ 2,00</button>
          <button class="btn-valor" onclick="enviarValor('${maquina.id}', 5, 5.00)">R$ 5,00</button>
          <button class="btn-valor" onclick="enviarValor('${maquina.id}', 10, 10.00)">R$ 10,00</button>
          <button class="btn-valor" onclick="enviarValor('${maquina.id}', 20, 20.00)">R$ 20,00</button>
          <button class="btn-valor" onclick="enviarValor('${maquina.id}', 50, 50.00)">R$ 50,00</button>
        </div>
        
        <div class="grupo-botoes">
          <button class="btn-pequeno btn-editar" onclick="abrirModalCadastro(maquina)">✏️ Editar</button>
          <button class="btn-pequeno btn-zerar" onclick="zerarPeriodo('${maquina.id}')">🔄 Zerar</button>
          <button class="btn-pequeno btn-excluir" onclick="excluirMaquina('${maquina.id}')">🗑️ Excluir</button>
        </div>
        
        <div class="historico">
          <h4>📝 Histórico</h4>
          ${maquina.historico.length === 0 
            ? '<p style="color:#555; font-size:12px; font-style:italic;">Nenhum registro ainda...</p>'
            : maquina.historico.slice(-5).reverse().map(item => `
                <div class="item-hist">
                  <span>${item.data}</span>
                  <span>R$ ${item.valor.toFixed(2).replace('.', ',')}</span>
                  <span>${item.pulsos}p</span>
                </div>
              `).join('')
          }
          <div class="total-box">
            Período: R$ ${maquina.periodo.valorTotal.toFixed(2).replace('.', ',')}
          </div>
        </div>
      </div>
    `;
  });
}

// Permitir Enter para logar
document.addEventListener('keypress', function(e) {
  if (e.key === 'Enter' && !document.getElementById('tela-login').classList.contains('escondido')) {
    verificarSenha();
  }
});
</script>

</body>
</html>
